name: Daily Syuka Summary Scheduler

on:
  schedule:
    # 매일 한국 시간(KST) 오전 5시 = UTC 오후 8시 (20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:
    # GitHub 웹 UI에서 수동으로 즉시 실행할 수 있게 설정
    inputs:
      force_video_id:
        description: '강제로 요약할 특정 유튜브 비디오 ID (비워두면 자동 감지)'
        required: false
        default: ''
      force_email:
        description: '강제 이메일 전송 여부 (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write # 워크플로우가 data.json 파일 변경 사항을 다시 커밋하고 푸시할 수 있도록 권한 부여
  pages: write    # GitHub Pages 배포 권한
  id-token: write # GitHub Pages 배포 토큰 발급 권한

jobs:
  run-automation:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run check and summarize
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        if [ "${{ github.event.inputs.force_video_id }}" != "" ]; then
          python scripts/check_and_summarize.py --force "${{ github.event.inputs.force_video_id }}"
        else
          python scripts/check_and_summarize.py
        fi

    - name: Send Email Notification
      env:
        SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
        SMTP_PORT: 587
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        if [ "${{ github.event.inputs.force_email }}" == "true" ]; then
          python scripts/send_email.py --force
        else
          python scripts/send_email.py
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add public/data.json
        
        if git diff --cached --quiet; then
          echo "No changes in public/data.json to commit."
        else
          git commit -m "Auto-update: New Syuka World video summary [skip ci]"
          git push origin main
        fi

    # GitHub Pages 자동 배포 영역
    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
